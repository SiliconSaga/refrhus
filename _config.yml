title: Refr Hus
description: >-
  A 1950s house measured by hand, modelled in Sweet Home 3D, and run through a
  Manual J load calculation — with the duct design that came out of it.

url: "https://siliconsaga.github.io"
baseurl: "/refrhus"

permalink: pretty
markdown: kramdown

kramdown:
  toc_levels: 2..3

sass:
  sass_dir: _sass
  style: compressed

# These three are why the documents need no front matter, and they MUST be
# declared here rather than assumed. GitHub's own Pages build injects them; a
# `bundle exec jekyll build` does not — the gem ships them, it does not enable
# them. Without this block every page except index.md is copied out as a raw
# `.md` file instead of being rendered, which is a working site turning into a
# directory of downloads.
#
#   optional-front-matter — render markdown that has no `---` header
#   relative-links        — rewrite `.md` links to their published URLs
#   titles-from-headings  — use the leading `# H1` as the page title
plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings

# optional-front-matter *copies* a markdown file into a page and leaves the
# original in place unless told otherwise, so every document ships twice: the
# rendered page at /ducting-scheme/ and a raw download at /ducting-scheme.md.
# The raw copies carry no nav, no theme and no styling, and search engines
# index them alongside the real pages.
optional_front_matter:
  remove_originals: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

# `vendor` matters more than it looks: `bundler-cache` installs gems into
# vendor/bundle, and Jekyll would otherwise try to render the site template
# shipped inside the jekyll gem — which fails the build outright.
exclude:
  - Refrhus.sh3d
  - sh3d-internals/
  - tools/
  - eldr-sidecar.yaml
  - .commits/
  - "*.PDF"
  - vendor/
  - Gemfile
  - Gemfile.lock
  - README.md
  - .github/
  # Source images the model was traced against. They stay in the repo because
  # the tracing is only checkable against them, but nothing on the site links
  # them, and `SurveyAlone.png` carries the street number and tax block/lot.
  # Publishing an unreferenced image of the property survey serves nobody.
  - OriginalFloorPlan.png
  - OriginalPlanHVAC.png
  - LargerFloorplanMudroomHvacV2.png
  - SurveyAlone.png
