# The left-hand contents, in two tiers.
#
# The site serves two readers who need very different amounts of it. A
# contractor needs the proposal — what to build and what it is sized against —
# which is the first three groups. Everything under "Working notes" is the
# owner's own record: how the house was measured, how the model is read, what
# is still unknown. It stays public because the numbers above are only
# checkable against it, but nobody pricing a job has to read it.
#
# Keep that boundary honest. A page a contractor needs belongs above it; one
# written to be edited rather than read belongs below.

