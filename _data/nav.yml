# The left-hand contents, in three tiers.
#
# 1. THE PACKAGE — Overview, The proposal, Load calculations. What a contractor
#    reads: what to build, and what it is sized against. `index.md` points at
#    exactly these three groups, so if a group is added or moved here, that
#    sentence has to move with it.
#
# 2. THE HOUSE AS MEASURED — the evidence under the numbers above. Worth
#    dipping into (chimney dimensions, joist spans) but not required reading.
#
# 3. APPENDIX — method, tooling and what is still unknown. How the model is
#    read, how this site is built, what nobody has measured yet. Published
#    because the figures above are only checkable against it; no part of it is
#    needed to price the job.
#
# Keep the boundary honest: a page a contractor needs goes in tier 1, one
# written to be edited rather than read goes in tier 3.

